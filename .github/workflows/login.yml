name: Douyin login screenshots

on:
  push:
    branches: ['feature/*']
  pull_request:
  workflow_dispatch:
    inputs:
      send_code:
        description: 'requests 实际发送一次验证码（13657450350）；浏览器发送始终被拦截'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt qrcode
          python -m playwright install-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test login flow with real CloakBrowser and a local fixture
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-fixture-verification
          path: verification/login/
  login:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: douyin-sms-request
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt
          python -m playwright install-deps chromium
          sudo apt-get install -y fonts-noto-cjk xvfb
      - name: Export real requests and call Douyin API directly
        env:
          SEND_CODE: ${{ inputs.send_code }}
        run: |
          trap 'rm -f output/douyin-api/request-bundle.json' EXIT
          capture_args=()
          request_args=()
          if [ "$SEND_CODE" = "true" ]; then
            capture_args+=(--capture-sms)
            request_args+=(--send-code)
          fi
          xvfb-run -a -s "-screen 0 1920x1080x24" python douyin_export.py --headed --phone 13657450350 "${capture_args[@]}"
          python douyin_requests.py --bundle output/douyin-api/request-bundle.json "${request_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-login
          path: |
            output/douyin-api/*.png
            output/douyin-api/result.json
            output/douyin-api/export-result.json
            output/douyin-api/api-result.json
            douyin_login.py
            douyin_export.py
            douyin_requests.py
            browser_setup.py
            requirements.txt
            README.md
          if-no-files-found: error
          retention-days: 7
