name: Douyin login screenshots

on:
  push:
    branches: ['feature/*']
  pull_request:
  workflow_dispatch:
    inputs:
      send_code:
        description: '点击一次发送验证码（13657450350）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt qrcode
          python -m playwright install-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test login flow with real CloakBrowser and a local fixture
        run: python -m unittest discover -s tests -p test_login.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-fixture-verification
          path: verification/login/
  login:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: douyin-sms-request
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt
          python -m playwright install-deps chromium
          sudo apt-get install -y fonts-noto-cjk xvfb
      - name: Capture real login and optionally request one SMS
        env:
          SEND_CODE: ${{ inputs.send_code }}
        run: |
          if [ "$SEND_CODE" = "true" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" python douyin_login.py --headed --send-code
          else
            xvfb-run -a -s "-screen 0 1920x1080x24" python douyin_login.py --headed
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-login
          path: |
            output/douyin-login/
            douyin_login.py
            browser_setup.py
            requirements.txt
            README.md
          if-no-files-found: error
          retention-days: 7
