name: Douyin login screenshots

on:
  push:
    branches: ['feature/*']
  pull_request:
  workflow_dispatch:
    inputs:
      phone:
        description: '已获准接收测试短信的手机号'
        type: string
        required: true
        default: '13657450350'
      send_code:
        description: '浏览器发送一次记录请求，随后 requests 再发送一次并保存接口二维码'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt qrcode
          python -m playwright install-deps chromium
          sudo apt-get install -y fonts-noto-cjk xvfb
      - name: Test login flow with real CloakBrowser and a local fixture
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-fixture-verification
          path: verification/login/
  login:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: douyin-sms-request
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt
          python -m playwright install-deps chromium
          sudo apt-get install -y fonts-noto-cjk xvfb
      - name: Record browser requests and verify SMS and QR with requests
        env:
          SEND_CODE: ${{ inputs.send_code }}
          PHONE: ${{ inputs.phone }}
        run: |
          trap 'rm -f output/douyin-api/request-bundle.json' EXIT
          capture_args=()
          if [ "$SEND_CODE" = "true" ]; then
            capture_args+=(--send-code)
          fi
          capture_status=0
          xvfb-run -a -s "-screen 0 1920x1080x24" python douyin_export.py --headed --phone "$PHONE" "${capture_args[@]}" || capture_status=$?
          echo "Browser capture exit status: $capture_status"
          # Explicit send_code also authorizes one independent requests SMS.
          # The API result decides success, even if the browser request failed.
          python douyin_requests.py --bundle output/douyin-api/request-bundle.json "${capture_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-login
          path: |
            output/douyin-api/*.png
            output/douyin-api/result.json
            output/douyin-api/export-result.json
            output/douyin-api/api-result.json
            douyin_login.py
            douyin_dom.js
            douyin_export.py
            douyin_requests.py
            browser_setup.py
            requirements.txt
            README.md
          if-no-files-found: error
          retention-days: 7
